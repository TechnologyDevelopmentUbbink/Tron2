site_name: TRON 2 Documentation
site_description: Technical documentation and internal knowledge base for the LimX Dynamics TRON 2
site_author: Technology Development Ubbink
site_url: https://technologydevelopmentubbink.github.io/Tron2/
repo_url: https://github.com/TechnologyDevelopmentUbbink/Tron2
repo_name: TechnologyDevelopmentUbbink/Tron2
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs"]
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - !relative $config_dir/overrides/.icons

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/homepage-search.js

copyright: Engineering documentation — Technology Development Ubbink


