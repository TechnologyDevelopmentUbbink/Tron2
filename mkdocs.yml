site_name: TRON 2 Documentation
site_description: Technical documentation and internal knowledge base for the LimX Dynamics TRON 2
site_author: Technology Development Ubbink
site_url: https://technologydevelopmentubbink.github.io/Tron2/
repo_url: https://github.com/TechnologyDevelopmentUbbink/Tron2
repo_name: TechnologyDevelopmentUbbink/Tron2
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

copyright: Engineering documentation — Technology Development Ubbink

nav:
  - Home: index.md
  - Projects:
    - Vision-to-Pointing Roadmap: projects/vision-pointing-roadmap.md
  - Robot Guide:
      - Start Here: getting-started/index.md
      - Safety: getting-started/safety.md
      - Robot Overview: hardware/robot-overview.md
      - Controller & VR: hardware/controller.md
      - Batteries & Charging: hardware/battery-and-charger.md
      - Connections & Indicators: hardware/connections-and-ports.md
      - Sensors: hardware/sensors.md
      - Operation: operation/index.md
      - Startup: operation/startup.md
      - Shutdown: operation/shutdown.md
      - Emergency Stop: operation/emergency-stop.md
  - Development:
      - SDK Overview: software/index.md
      - Installation: software/installation.md
      - Firmware: software/firmware.md
      - Version Compatibility: software/version-compatibility.md
      - Networking: networking/index.md
      - ROS 2 & Models: ros2/index.md
      - Isaac Sim, Isaac Lab & FluxVLA Training: software/isaac-sim-training.md
      - C++ API: programming/cpp.md
      - Python API: programming/python.md
      - High-level API: programming/api-reference.md
  - Troubleshooting: troubleshooting/index.md
  - Reference:
      - Specifications: reference/specifications.md
      - System Architecture: reference/system-architecture.md
      - Terminology: reference/terminology.md
      - Command Reference: reference/command-reference.md
      - Document Sources: reference/document-sources.md
      - Revision History: reference/revision-history.md
  - Contributing:
      - contributing/index.md
      - Editing Pages: contributing/editing-pages.md
      - Adding Images: contributing/adding-images.md
      - Writing Style: contributing/writing-style.md
      - Source Classification: contributing/source-classification.md
      - Review Process: contributing/review-process.md
      - Documentation Versioning: contributing/versioning.md
